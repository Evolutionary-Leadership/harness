name: Merge feature branch to preprod (to-preprod)

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.pr-description.md'

concurrency:
  group: to-preprod-${{ github.ref_name }}
  cancel-in-progress: true

# Two jobs, and the split is the point. `gate` merges the session commit
# into feature/<name>, strips the signal files, pushes once as the PAT,
# opens the PR and waits for CI; none of that touches preprod, so it holds
# no lock and runs in parallel with every other writer. `merge` holds the
# preprod-write group only around the write itself: the PR merge, the ADR
# claim promotion, the preprod sweep. A gate that polls CI for ten minutes
# used to hold that lock for all ten, which serialised every merge and
# every release behind it.
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # checks: read is required by the CI merge gate below: it reads the
      # 'check' run's conclusion on the PR head via the default token, which
      # otherwise gets no checks scope on private repos.
      checks: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      feature_branch: ${{ steps.pr.outputs.feature_branch }}
      review: ${{ steps.pr.outputs.review }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Extract feature name from branch
        id: feature
        run: |
          BRANCH="${{ github.ref_name }}"
          WITHOUT_PREFIX="${BRANCH#claude/}"
          CODENAME="${WITHOUT_PREFIX%-*}"
          # Prefer the committed slug in .harness-feature; fall back to the
          # random session codename. Keep this validation identical to
          # .claude/scripts/resolve-feature-name.sh and the other workflows.
          SLUG="$(git show "${{ github.sha }}:.harness-feature" 2>/dev/null | head -n1 | tr -d '[:space:]' || true)"
          if printf '%s' "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$' && [ "$SLUG" != preprod ] && [ "$SLUG" != dev ] && [ "$SLUG" != main ]; then FEATURE_NAME="$SLUG"; else FEATURE_NAME="$CODENAME"; fi
          # A branch that named itself and then lost .harness-feature did not
          # choose its codename. The usual way to lose it is merging
          # feature/<name> back after to-preprod opened the PR: that branch
          # carries the signal-file cleanup, and git carries the deletion
          # across. Falling back then created feature/<codename> (and, on
          # Railway, an environment) that the session could not delete. So
          # when this branch's own commits, the ones not yet on preprod, set a
          # name the pushed commit no longer carries, refuse and name the fix.
          # Commits already on preprod are excluded, so a merged feature's name
          # never binds the next session cut from it. Forge decision record 0042.
          if [ "$FEATURE_NAME" = "$CODENAME" ]; then
            LOST=$(git log --format=%s "origin/preprod..${{ github.sha }}" 2>/dev/null \
              | sed -n 's/^chore: set feature name (\([a-z0-9][a-z0-9-]*\))$/\1/p' | head -n1)
            if [ -n "$LOST" ] && [ "$LOST" != "$CODENAME" ]; then
              echo "::error::This branch set the feature name '$LOST', but .harness-feature is gone from ${{ github.sha }}, usually because feature/$LOST was merged back after its PR opened. Nothing was created or merged: the codename would have opened feature/$CODENAME beside it. If '$LOST' is this session's feature, restore it without a push of its own ('bash .claude/scripts/set-feature-name.sh --no-push $LOST') and push again; if it arrived with someone else's branch, name this session's own feature instead."
              exit 1
            fi
          fi
          echo "name=$FEATURE_NAME" >> "$GITHUB_OUTPUT"
          echo "branch=feature/$FEATURE_NAME" >> "$GITHUB_OUTPUT"

      - name: Read the review flag from the signal file
        id: signal
        run: |
          # Two decisions below turn on this one flag: whether the Railway
          # environment is torn down, and whether .railway-url is stripped
          # from the branch. Both must agree, so the flag is parsed once
          # here rather than twice further down.
          #
          # Read it from the pushed commit, not the working tree: the merge
          # step runs after this one, and the strip it ends in removes the
          # file from the branch.
          REVIEW=$(git show "${{ github.sha }}:.pr-description.md" 2>/dev/null \
            | sed -n '/^---$/,/^---$/{ /^review:/{ s/^review: *//; p; } }' \
            | head -n1 | tr -d '[:space:]')
          # Anything but an explicit true is a merge: an unreadable or absent
          # signal file must not leave a merged feature's environment running.
          [ "$REVIEW" = "true" ] || REVIEW=false
          echo "review=$REVIEW" >> "$GITHUB_OUTPUT"
          echo "Review mode: $REVIEW"

      - name: Delete Railway environment
        # Merge path only. A PR opened by /review keeps its environment: humans
        # are about to exercise the change on the preview URL, and tearing it
        # down under them is what made the workflow republish .railway-url
        # after cleanup, which is how the URL leaked into preprod.
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != '' && steps.signal.outputs.review != 'true'
        env:
          RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          gql() {
            local resp
            resp=$(curl -s -X POST "$API_URL" \
              -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"$1\"}") || true
            if echo "$resp" | jq . >/dev/null 2>&1; then
              echo "$resp"
            else
              echo '{"data":null}'
            fi
          }

          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty")

          if [ -z "$ENV_ID" ]; then
            echo "No Railway environment '$FEATURE_NAME' found, nothing to delete."
            exit 0
          fi

          echo "Deleting Railway environment '$FEATURE_NAME' (ID: $ENV_ID)..."
          gql "mutation { environmentDelete(id: \\\"$ENV_ID\\\") }"
          echo "Railway environment deleted. The push that follows will not trigger a deploy."


      - name: Merge claude/ into feature/, strip the signal files and push
        id: push
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FEATURE_BRANCH="${{ steps.feature.outputs.branch }}"
          CLAUDE_SHA="${{ github.sha }}"

          # Preflight: the push below and the PR step after it both need a
          # Personal Access Token. We deliberately do NOT fall back to
          # GITHUB_TOKEN: a push made with it starts no 'check' run, and a PR
          # merged with it triggers no downstream workflow (for example
          # harness-version-bump.yml), which silently breaks the dogfooded
          # version-bump chain.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PAT_TOKEN is missing or empty in repo secrets."
            echo "::error::This workflow needs a Personal Access Token to push feature/<name>, create the PR and trigger downstream workflows on merge. GITHUB_TOKEN cannot be used as a fallback: a push made with it starts no check run, and PRs merged with it do not trigger workflow runs (e.g. harness-version-bump.yml would never fire)."
            echo "::error::Fix: Settings -> Secrets and variables -> Actions -> add PAT_TOKEN. Fine-grained PAT scoped to this repo with Contents: read/write, Pull requests: read/write, Workflows: read/write. Classic PAT equivalent: 'repo' + 'workflow' scopes."
            echo "::error::After the secret is set, re-trigger this workflow from the session: change .pr-description.md, commit it as 'chore: trigger auto-merge to preprod' and push (/to-preprod step 8). A push that leaves that file alone does not start this workflow. Nothing was pushed to feature/<name>, so the signal files are still on the session branch."
            exit 1
          fi

          # Merge the session commit, resolving the one class of conflict this
          # chain produces itself. to-preprod strips the signal files from
          # feature/<name> before it opens the PR; when that PR cannot
          # merge (preprod moved), the session's recovery push still carries
          # them, often edited, and the merge stops on modify/delete. Signal
          # files are plumbing rather than reviewable content, so they resolve
          # to the incoming claude/ side, which is the newer intent. Any other
          # conflict fails honestly. .release-description.md is deliberately
          # absent: on preprod it is the live release trigger, and a session
          # carrying one never reaches this step.
          #
          # Keep this function identical in every workflow that merges a
          # claude/ commit into feature/<name>; the forge's drift test runs
          # each copy and refuses a difference. Forge decision record 0042.
          merge_session() {
            if git merge "$1" --no-edit; then
              return 0
            fi
            local CONFLICTS RESOLVED f
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            # A merge can fail without leaving index conflicts (a dirty tree,
            # unrelated histories). Say so rather than falling through to a
            # misleading "nothing to commit".
            if [ -z "$CONFLICTS" ]; then
              echo "::error::git merge failed without index conflicts"
              if git rev-parse -q --verify MERGE_HEAD > /dev/null; then
                git merge --abort
              fi
              return 1
            fi
            RESOLVED=true
            while IFS= read -r f; do
              case "$f" in
                .pr-description.md|.railway-url|.harness-init|.harness-feature|.harness/env/*.env)
                  # Guard every git call: under errexit a bare failure would
                  # kill the step mid-merge instead of reaching the abort below.
                  if git cat-file -e "$1:$f" 2> /dev/null; then
                    git checkout "$1" -- "$f" && git add -- "$f" || RESOLVED=false
                  else
                    git rm -f -- "$f" > /dev/null || RESOLVED=false
                  fi
                  ;;
                *)
                  echo "::error::Merge conflict on non-signal file: $f"
                  RESOLVED=false
                  ;;
              esac
            done <<< "$CONFLICTS"
            if [ "$RESOLVED" != true ]; then
              git merge --abort
              return 1
            fi
            git commit --no-edit
          }

          # The signal files leave feature/<name> before the PR opens, in the
          # same push as the merge, so the head the PR opens on is the head
          # that merges and the PR's "opened" event starts the one 'check'
          # run the gate waits for. .harness-feature MUST be among them: it
          # carries this session's feature name and must not leak onto
          # preprod, or a future session cloned from preprod would inherit
          # this feature's name. The list is exported for the gate step's
          # recovery, which strips the same files again.
          #
          # .railway-url is stripped on the merge path only. In review mode the
          # environment it names is still running (the teardown above was
          # skipped), and reviewers read the URL off the branch for the whole
          # life of the PR. The /to-preprod run that lands the approved PR
          # strips it then.
          REVIEW="${{ steps.signal.outputs.review }}"
          SIGNAL_FILES=".pr-description.md .harness-init .harness-feature"
          if [ "$REVIEW" != "true" ]; then
            SIGNAL_FILES="$SIGNAL_FILES .railway-url"
          fi
          # The preview's own variables (.harness/env/<name>.env) go the same
          # way and for the same reason: they belong to the environment the
          # merge path just deleted, and a review keeps both. A file path,
          # not the directory, so git rm needs no -r.
          if [ "$REVIEW" != "true" ]; then
            SIGNAL_FILES="$SIGNAL_FILES .harness/env/${FEATURE_BRANCH#feature/}.env"
          fi
          echo "signal_files=$SIGNAL_FILES" >> "$GITHUB_OUTPUT"
          remove_signal_files() {
            git rm -f --ignore-unmatch $SIGNAL_FILES > /dev/null 2>&1 || true
            git commit -m "chore: remove signal files" > /dev/null 2>&1 || true
          }

          # One push, as the PAT. A push authenticated as the checkout's
          # persisted GITHUB_TOKEN starts no workflow, and this push is what
          # the PR's check run is started against. Two things make it run as
          # the PAT (GH_TOKEN is PAT_TOKEN here): the PAT goes into the
          # remote URL, and the push resets the http extraheader that
          # checkout persisted, because git sends only that header when it
          # is set and ignores URL credentials.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          pat_push() {
            git -c "http.https://github.com/.extraheader=" push origin "$FEATURE_BRANCH"
          }

          # claude-to-feature-branch.yml fires on the same push when files
          # other than .pr-description.md are touched. Both workflows then
          # try to push feature/, and one loses with "cannot lock ref".
          # Loop: refetch, merge unless our SHA is already in, strip, push,
          # retry on rejection.
          for attempt in 1 2 3 4 5; do
            REMOTE_HEAD=""
            # Decide off the fetch result, not a separate ls-remote probe: a
            # branch claude-to-feature-branch.yml creates between the two would
            # pass the probe with no local ref to check out, and the checkout
            # would end the step before this loop could retry.
            if git fetch origin "$FEATURE_BRANCH" 2>/dev/null; then
              git checkout -B "$FEATURE_BRANCH" FETCH_HEAD
              REMOTE_HEAD=$(git rev-parse FETCH_HEAD)
            else
              git checkout preprod
              git checkout -B "$FEATURE_BRANCH"
            fi

            if git merge-base --is-ancestor "$CLAUDE_SHA" HEAD 2>/dev/null; then
              echo "feature/$FEATURE_BRANCH already contains $CLAUDE_SHA; stripping only."
            else
              merge_session "$CLAUDE_SHA"
            fi
            remove_signal_files

            # A rerun whose merge and strip both landed already has nothing
            # to push, and the PR step reuses the open PR.
            if [ -n "$REMOTE_HEAD" ] && [ "$(git rev-parse HEAD)" = "$REMOTE_HEAD" ]; then
              echo "feature/$FEATURE_BRANCH already carries $CLAUDE_SHA with no signal files; nothing to push."
              exit 0
            fi

            if pat_push; then
              echo "Pushed feature/$FEATURE_BRANCH on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt (likely raced with claude-to-feature-branch.yml). Refetching and retrying..."
            sleep "$attempt"
          done

          echo "::error::Failed to push feature/$FEATURE_BRANCH after 5 attempts."
          exit 1

      - name: Create PR and gate on CI
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          FEATURE_BRANCH="${{ steps.feature.outputs.branch }}"
          CLAUDE_SHA="${{ github.sha }}"
          echo "feature_branch=$FEATURE_BRANCH" >> "$GITHUB_OUTPUT"

          git checkout "$FEATURE_BRANCH"

          # The signal file left the branch in the step above, so it is read
          # from the pushed commit into the working tree for the parsers
          # below, and removed again once parsed. It is never committed here.
          git show "$CLAUDE_SHA:.pr-description.md" > .pr-description.md

          # Parse frontmatter fields. The front matter is read with sed, not a
          # YAML parser, so a title quoted the YAML way (the natural way to
          # carry a colon) reached the PR with its quotes on. pr_title strips
          # one surrounding pair of matching quotes and takes the rest
          # verbatim; /to-preprod step 5 says the same to the writer.
          pr_title() {
            local t
            t=$(sed -n '/^---$/,/^---$/{ /^title:/{ s/^title: *//; p; } }' "$1" | head -n1)
            t=${t%"${t##*[![:space:]]}"}
            case "$t" in
              \"*\") t=${t#\"}; t=${t%\"} ;;
              \'*\') t=${t#\'}; t=${t%\'} ;;
            esac
            printf '%s' "$t"
          }
          TITLE=$(pr_title .pr-description.md)
          if [ -z "$TITLE" ]; then
            TITLE="Merge $FEATURE_BRANCH into preprod"
          fi
          # Parsed once, in the "Read the review flag" step above, because the
          # Railway teardown and the strip list needed the same answer before
          # this step ran.
          REVIEW="${{ steps.signal.outputs.review }}"
          REVIEWERS=$(sed -n '/^---$/,/^---$/{ /^reviewers:/{ s/^reviewers: *//; p; } }' .pr-description.md)

          # Parse body: everything after the second ---
          awk 'BEGIN{c=0} /^---$/{c++; next} c>=2{print}' .pr-description.md > /tmp/pr-body.md
          rm -f .pr-description.md

          # Create or reuse the PR. The stripped head is already on the
          # branch, so opening the PR is the event that starts its check run
          # (on a reused PR, the push's own "synchronize" event already did).
          # A failure here leaves feature/<name> stripped with no PR, which
          # the step 8 recovery push repairs: merge_session resolves the
          # signal files it re-adds, and the next run strips and opens again.
          EXISTING=$(gh pr list --head "$FEATURE_BRANCH" --base preprod --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
          else
            PR_URL=$(gh pr create --base preprod --head "$FEATURE_BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md)
            PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Assign reviewers if configured
          if [ -n "$REVIEWERS" ]; then
            IFS=', ' read -ra REVIEWER_LIST <<< "$REVIEWERS"
            for reviewer in "${REVIEWER_LIST[@]}"; do
              reviewer=$(echo "$reviewer" | xargs)
              [ -n "$reviewer" ] && gh pr edit "$PR_NUMBER" --add-reviewer "$reviewer" || true
            done
          fi

          # If review mode: skip auto-merge, leave PR open for review. The
          # merge job reads this output and skips the merge step.
          if [ "$REVIEW" = "true" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "PR #$PR_NUMBER created for review, skipping auto-merge."
            echo "::notice::PR #$PR_NUMBER is open for review at $(gh pr view $PR_NUMBER --json url --jq .url)"
            exit 0
          fi
          echo "review=false" >> "$GITHUB_OUTPUT"

          # The gate's recovery (restrip_head, below) strips the same list
          # the push step did and pushes as the PAT for the same reason it
          # did: only a user-identity push starts a check run. Each step is
          # its own shell, so both helpers are defined again here.
          SIGNAL_FILES="${{ steps.push.outputs.signal_files }}"
          remove_signal_files() {
            git rm -f --ignore-unmatch $SIGNAL_FILES > /dev/null 2>&1 || true
            git commit -m "chore: remove signal files" > /dev/null 2>&1 || true
          }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          pat_push() {
            git -c "http.https://github.com/.extraheader=" push origin "$FEATURE_BRANCH"
          }

          # A PR that conflicts with preprod never gets a 'check' run: GitHub
          # starts no pull_request workflow for it. The gate below then waited
          # out its grace period and blamed a bot-pushed head, which sent the
          # reader hunting for a token problem that did not exist. Ask GitHub
          # first. Mergeability is computed after the push, so UNKNOWN is
          # polled for up to two minutes (40 tries of 3s), the grace the gate
          # itself gives a missing check; anything but CONFLICTING goes on to
          # the gate. An answer counts only for the head this run just left
          # on the branch: right after a push GitHub can still hold the
          # previous head's CONFLICTING, and trusting it would refuse the very
          # PR a recovery push has just fixed.
          EXPECTED_HEAD=$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" 2>/dev/null | cut -f1)
          MERGEABLE=UNKNOWN
          for _try in $(seq 1 40); do
            ANSWER=$(gh pr view "$PR_NUMBER" --json mergeable,headRefOid --jq '"\(.mergeable) \(.headRefOid)"' 2>/dev/null || echo "UNKNOWN none")
            MERGEABLE=${ANSWER%% *}
            if [ -n "$EXPECTED_HEAD" ] && [ "${ANSWER#* }" != "$EXPECTED_HEAD" ]; then
              MERGEABLE=UNKNOWN
            fi
            [ "$MERGEABLE" = UNKNOWN ] || break
            sleep 3
          done
          if [ "$MERGEABLE" = CONFLICTING ]; then
            echo "::error::PR #$PR_NUMBER conflicts with preprod, which moved after the signal push; merge not performed."
            gh pr comment "$PR_NUMBER" --body "**Merge not performed: this PR conflicts with \`preprod\`,** which moved after the signal push. CI did not fail: GitHub runs no check on a conflicting PR. Recover in the session: merge \`origin/preprod\` into its \`claude/\` branch (never \`$FEATURE_BRANCH\`, which lost its signal files when this PR opened), resolve, record the resolution in \`.pr-description.md\`, commit it as \`chore: trigger auto-merge to preprod\` and push. This PR is reused; no second one opens. See \`/to-preprod\` step 8."
            exit 1
          fi

          # When a check: or tests: command is configured in .harness-version,
          # CI is the merge gate: wait for the 'check' run on the PR HEAD (and
          # the 'tests' run beside it when the head carries a tests: line) and
          # hand the head to the merge job only on success. A tests: line
          # alone still gates: the 'check' job always exists and finishes
          # green with its steps skipped, so awaiting both names is safe. Never rely on
          # 'gh pr merge --auto' for this: auto-merge only waits for checks
          # that branch protection marks as required, and on repos without
          # branch protection (for example a private repo on a free plan) it
          # degrades to an immediate merge, making CI decorative for the
          # merge decision. Both lines are read at the merged head, which is
          # what the working tree holds here.
          CHECK_CMD=$(grep '^check:' .harness-version 2>/dev/null | sed 's/^check: *//' || true)
          TESTS_CMD=$(grep '^tests:' .harness-version 2>/dev/null | sed 's/^tests: *//' || true)
          # The run names the gate waits for. 'check' is always one of them;
          # 'tests' joins it when the merged head carries a tests: line, which
          # is what makes feature-branch-checks.yml run that job for real.
          AWAITED="check"
          if [ -n "$TESTS_CMD" ]; then
            AWAITED="check tests"
          fi
          if [ -n "$CHECK_CMD" ] || [ -n "$TESTS_CMD" ]; then
            # A head pushed with a bot token cannot produce a usable 'check'
            # run: GitHub does not start pull_request workflows for such a
            # push, so the run is either never created or created as
            # action_required and resolved without executing. Polling it can
            # only time out, and the gate then reported "CI status 'pending'",
            # which sends the reader hunting for a test failure that never
            # happened.
            #
            # Two functions below answer the two questions that distinguishes
            # that from a real red: is this head one a bot pushed, and can the
            # signal files be stripped off it again? Stripping is the recovery:
            # it pushes a user-identity (PAT) commit, which starts a real check
            # run on a real head. The gate is never relaxed. Accepting an
            # earlier commit's green instead would merge the bot's file onto
            # preprod AND assert a check the gate never saw on the head it
            # merged. Forge decision record 0041.
            #
            # Retried, because one unlucky API call must not be what decides
            # this. An unanswerable lookup falls through to "not a bot", which
            # is the safe direction for merging (the gate refuses rather than
            # recovers) and the unsafe one for the message, so it says so.
            head_is_bot() {
              local who=""
              for _try in 1 2 3; do
                who=$(GH_TOKEN=${{ github.token }} gh api \
                  "/repos/${{ github.repository }}/commits/$1" \
                  --jq '[.author.login // "", .commit.author.email // ""] | join(" ")' 2>/dev/null || echo "")
                if [ -n "${who// /}" ]; then break; fi
                sleep 2
              done
              if [ -z "${who// /}" ]; then
                echo "::warning::Could not read the author of $1 after 3 attempts; treating it as a human push, so a red below is reported as a real failure."
                return 1
              fi
              case "$who" in
                *'[bot]'*) return 0 ;;
              esac
              return 1
            }

            # Re-strip the signal files and push as the PAT. Returns non-zero
            # when there is nothing to strip, which is the honest answer that
            # this head is not the signal-file case and cannot be recovered
            # here. remove_signal_files and pat_push are defined above.
            restrip_head() {
              git fetch origin "$FEATURE_BRANCH" > /dev/null 2>&1 || return 1
              git reset --hard "origin/$FEATURE_BRANCH" > /dev/null 2>&1 || return 1
              remove_signal_files
              if git diff --quiet "origin/$FEATURE_BRANCH"; then return 1; fi
              pat_push
            }

            # The newest run of one name on one head: its conclusion, else
            # its status while it runs, else the synthetic 'missing'. The
            # check-runs API needs checks:read; PAT_TOKEN may not carry that
            # scope, so this one call uses the workflow's default token.
            run_state() {
              GH_TOKEN=${{ github.token }} gh api \
                "/repos/${{ github.repository }}/commits/$1/check-runs" \
                --jq "[.check_runs[] | select(.name==\"$2\")] | max_by(.started_at) | (.conclusion // .status // \"missing\")" 2>/dev/null || echo missing
            }

            # Budget: 144 ticks of 5s is a hard 12-minute cap per round, and
            # three rounds (the first, plus one per recovery) make 36 minutes
            # worst case. Only a round that ends in a recovery costs its full
            # 12: an unrunnable head is recognised in seconds (action_required)
            # or two minutes (missing), so the common shape is minutes, not
            # half an hour. A check: command that runs longer than one round
            # fails every gated merge; keep the check chain under the cap or
            # raise the budget here.
            echo "Waiting for CI ($AWAITED) on PR #$PR_NUMBER HEAD..."
            CI_RESULT=pending
            CHECK=missing
            UNRUNNABLE_HEAD=""
            RESTRIPS=0
            # How long 'missing' may persist on a bot-pushed head before it
            # counts as unrunnable. A real run's check appears within seconds;
            # two minutes is slack for a busy runner queue, not a diagnosis.
            MISSING_GRACE_TICKS=24
            for round in 1 2 3; do
              MISSING_TICKS=0
              UNRUNNABLE_HEAD=""
              PR_HEAD=""
              for i in $(seq 1 144); do
                PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
                if [ -z "$PR_HEAD" ]; then
                  echo "  [round $round] [$i/144] HEAD fetch failed, retrying next tick"
                  sleep 5
                  continue
                fi
                # Every awaited name is read on every tick and classified on
                # its own; the tick's verdict is the worst of them. The gate
                # merges only when every name is success. One red is a red,
                # and anything else is a wait, except that action_required or
                # missing on the 'check' run is a candidate for the
                # unrunnable-head recovery. Only 'check' can say that: its job
                # always exists, so a head GitHub ran at all has a run of it.
                # A 'tests' run that never appears beside a real 'check' state
                # is a workflow without the job (a downstream mid-upgrade),
                # which the timeout below reports by name.
                CHECK=""
                ALL_GREEN=true
                RED=""
                CHECK_MISSING=false
                CHECK_ACTION_REQUIRED=false
                for name in $AWAITED; do
                  state=$(run_state "$PR_HEAD" "$name")
                  CHECK="${CHECK:+$CHECK }$name=$state"
                  [ "$state" = success ] || ALL_GREEN=false
                  case "$state" in
                    failure|cancelled|timed_out) [ -n "$RED" ] || RED="$state" ;;
                    action_required) if [ "$name" = check ]; then CHECK_ACTION_REQUIRED=true; fi ;;
                    missing) if [ "$name" = check ]; then CHECK_MISSING=true; fi ;;
                  esac
                done
                echo "  [round $round] [$i/144] HEAD=$PR_HEAD $CHECK"
                if [ "$ALL_GREEN" = true ]; then
                  CI_RESULT=success
                  break
                fi
                if [ -n "$RED" ]; then
                  CI_RESULT="$RED"
                  break
                fi
                # action_required is what a never-executed run reports, but it
                # is also what a run legitimately waiting on approval reports,
                # so it is conclusive only on a bot-pushed head. Without that
                # qualifier a fork or first-time-contributor PR would burn a
                # re-strip before refusing.
                if [ "$CHECK_ACTION_REQUIRED" = true ] && head_is_bot "$PR_HEAD"; then
                  UNRUNNABLE_HEAD="$PR_HEAD"
                  break
                fi
                # 'missing' needs a grace period (a real run appears within
                # seconds), and only counts as unrunnable on a bot-pushed head.
                if [ "$CHECK_MISSING" = true ]; then
                  MISSING_TICKS=$((MISSING_TICKS + 1))
                  if [ "$MISSING_TICKS" -ge "$MISSING_GRACE_TICKS" ] && head_is_bot "$PR_HEAD"; then
                    UNRUNNABLE_HEAD="$PR_HEAD"
                    break
                  fi
                else
                  MISSING_TICKS=0
                fi
                sleep 5
              done

              # A bot-pushed head's run can also resolve 'failure' without ever
              # executing a step, so a red on such a head is not evidence of a
              # red test. Reclassify it rather than reporting a failure that
              # did not happen; the recovery below produces a head whose red,
              # if it comes, is real.
              case "$CI_RESULT" in
                failure|cancelled|timed_out)
                  if [ -n "$PR_HEAD" ] && head_is_bot "$PR_HEAD"; then
                    echo "'$CI_RESULT' was reported on bot-pushed head $PR_HEAD, which never ran; treating it as unrunnable."
                    UNRUNNABLE_HEAD="$PR_HEAD"
                    CI_RESULT=pending
                  fi
                  ;;
              esac

              if [ "$CI_RESULT" = success ]; then
                break
              fi
              if [ -z "$UNRUNNABLE_HEAD" ]; then
                break
              fi
              if [ "$RESTRIPS" -ge 2 ]; then
                break
              fi
              echo "Head $UNRUNNABLE_HEAD cannot produce a check run. Re-stripping the signal files so a user-identity push starts one..."
              if restrip_head; then
                RESTRIPS=$((RESTRIPS + 1))
                UNRUNNABLE_HEAD=""
                CI_RESULT=pending
                continue
              fi
              echo "Could not restore a checkable head for $UNRUNNABLE_HEAD: either nothing was left to strip, or the push was rejected."
              break
            done

            if [ "$CI_RESULT" != "success" ]; then
              # Exit non-zero so the workflow conclusion honestly reports
              # that the merge did NOT happen.
              if [ -n "$UNRUNNABLE_HEAD" ]; then
                # Say what is actually wrong. "CI status was pending" sends
                # the reader looking for a broken test; there is none.
                WHY="head $UNRUNNABLE_HEAD was pushed with a bot token, so GitHub will not run CI on it (last run state: '$CHECK'). CI did not fail on this PR; it never ran on this head."
                echo "::error::Merge not performed for PR #$PR_NUMBER: $WHY"
                gh pr comment "$PR_NUMBER" --body "**Merge not performed: the PR head cannot produce a CI check.** The $WHY Re-trigger to-preprod from the session with a push that changes \`.pr-description.md\` (\`/to-preprod\` step 8): its strip is a PAT push, which starts a real check run, and it merges on the green that follows. A push that leaves that file alone starts no to-preprod run. Do not read this as a test failure."
              else
                # Timeouts report the last observed run states (e.g. skipped)
                # so the operator sees why the gate never resolved.
                echo "::error::CI status '$CI_RESULT' (last check state: '$CHECK') for PR #$PR_NUMBER; merge not performed."
                gh pr comment "$PR_NUMBER" --body "**Merge not performed: CI status was '$CI_RESULT'** (last check state: '$CHECK'). Fix the failure (or wait for CI to finish) and merge manually with \`gh pr merge $PR_NUMBER --merge\`, or fix it in the session and re-trigger to-preprod: a push re-triggers it only when it changes \`.pr-description.md\` (\`/to-preprod\` step 8)."
              fi
              exit 1
            fi
          fi

          # Gate passed. With CI configured this point is only reached on a
          # green for every awaited run; without CI there is nothing to wait
          # for. The merge job lands exactly this head: it is handed over as
          # an output, and a head that moved in the meantime is refused
          # there, because the green was seen on this one.
          if [ -z "${PR_HEAD:-}" ]; then
            PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          fi
          echo "head_sha=$PR_HEAD" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER at $PR_HEAD passed the gate; handing it to the merge job."

  merge:
    needs: gate
    runs-on: ubuntu-latest
    # The only job that writes preprod, so the only one that holds the
    # lock. Queued, never cancelled: a merge interrupted between the PR
    # merge and the sweep leaves preprod carrying a signal file.
    concurrency:
      group: preprod-write
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Merge the PR into preprod
        if: needs.gate.outputs.review != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER="${{ needs.gate.outputs.pr_number }}"
          FEATURE_BRANCH="${{ needs.gate.outputs.feature_branch }}"
          GATED_HEAD="${{ needs.gate.outputs.head_sha }}"

          # The gate saw its green on one head. If the branch moved while
          # this job waited for the lock, that green is not this head's, and
          # the merge is refused rather than trusted. An unanswerable lookup
          # is not evidence that it moved.
          HEAD_NOW=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -n "$GATED_HEAD" ] && [ -n "$HEAD_NOW" ] && [ "$HEAD_NOW" != "$GATED_HEAD" ]; then
            echo "::error::PR #$PR_NUMBER moved from $GATED_HEAD to $HEAD_NOW after the gate passed; merge not performed."
            gh pr comment "$PR_NUMBER" --body "**Merge not performed: the PR head moved after CI passed** (gated \`$GATED_HEAD\`, now \`$HEAD_NOW\`). The gate merges only a head it saw go green. Re-trigger to-preprod from the session with a push that changes \`.pr-description.md\` (\`/to-preprod\` step 8), which gates the new head."
            exit 1
          fi

          # Land it. The --auto fallback stays for repos where required
          # status checks make an immediate merge refuse; the gate has
          # already passed, so it is a merge mechanism here, not a gate.
          merged=0
          for i in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --merge; then merged=1; break; fi
            if gh pr merge "$PR_NUMBER" --auto --merge 2>/dev/null; then merged=1; break; fi
            echo "Merge attempt $i did not complete, retrying in ${i}s..."
            sleep "$i"
          done
          if [ "$merged" = 1 ]; then
            echo "PR #$PR_NUMBER merged (or set to auto-merge once required checks pass) into preprod."
          else
            echo "::error::merge did not complete for PR #$PR_NUMBER"
            gh pr comment "$PR_NUMBER" --body "**Auto-merge did not complete**, likely due to merge conflicts with preprod. Recover in the session: merge \`origin/preprod\` into its \`claude/\` branch (never \`$FEATURE_BRANCH\`, which lost its signal files when this PR opened), resolve, then change \`.pr-description.md\` and push to re-trigger to-preprod (\`/to-preprod\` step 8)."
            # Red, as the gate's own refusals are: a run that stayed green here
            # told the session the merge had happened, and step 8, which the
            # comment points at, is written for a run that failed.
            exit 1
          fi


      # A claimed ADR number becomes permanently reserved once its record is
      # on preprod. Until then it is only a reservation, which a reaper may
      # release again if the feature dies without ever writing the file.
      # See the forge decision record on claiming ADR numbers.
      #
      # That id is spelled in words on purpose: this file lands at
      # .github/workflows/ downstream, where check-docs walks, and a bare
      # "ADR NNNN" would resolve against a scaffold's decisions directory
      # that holds only its seed record. Same rule as harness-preflight.yml.
      #
      # Runs inside the preprod-write concurrency group this job already holds,
      # so it cannot race another writer, and it is deliberately non-fatal:
      # the merge is the important part, the register is advisory.
      - name: Promote this feature's ADR claims to landed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -uo pipefail

          # The branch comes from the gate job; PR_NUMBER is read back from
          # the API rather than from the gate's output, because what matters
          # here is whether the PR is MERGED, not which number it has.
          FEATURE_BRANCH="${{ needs.gate.outputs.feature_branch }}"
          FEATURE_NAME="${FEATURE_BRANCH#feature/}"
          REPO="${{ github.repository }}"

          PR_NUMBER=$(gh pr list --head "$FEATURE_BRANCH" --base preprod --state all \
            --json number,state --jq 'map(select(.state=="MERGED")) | .[0].number // empty' 2>/dev/null || true)
          # The merge step may have fallen back to --auto, and a /review PR
          # is not merged at all, so an unmerged PR reaches this point too.
          # A claim must only land when its ADR actually did.
          if [ -z "$PR_NUMBER" ]; then
            echo "PR for $FEATURE_BRANCH is not merged; leaving claims as they are."
            exit 0
          fi

          if ! git fetch --quiet origin coordination 2>/dev/null; then
            echo "No coordination branch; nothing to promote."
            exit 0
          fi

          CLAIMS=$(git ls-tree -r --name-only origin/coordination claims/adr/ 2>/dev/null \
            | grep -E 'claims/adr/[0-9]{4}\.md$' || true)
          [ -n "$CLAIMS" ] || { echo "No ADR claims; nothing to promote."; exit 0; }

          for path in $CLAIMS; do
            body=$(git show "origin/coordination:$path" 2>/dev/null || true)
            case "$body" in
              *"claimed_by: $FEATURE_NAME"*) ;;
              *) continue ;;
            esac
            case "$body" in
              *"state: landed"*) echo "$path already landed"; continue ;;
            esac

            # Insert landed_in directly after the state line. Appending it
            # instead would put the key after the closing --- and outside the
            # front matter, where nothing would ever read it.
            updated=$(printf '%s\n' "$body" \
              | sed "s/^state: claimed$/state: landed\\nlanded_in: \"$PR_NUMBER\"/")
            if [ "$updated" = "$body" ]; then
              echo "$path did not carry 'state: claimed'; left untouched"
              continue
            fi

            sha=$(gh api "repos/$REPO/contents/$path?ref=coordination" --jq .sha 2>/dev/null || true)
            [ -n "$sha" ] || { echo "::warning::could not read $path"; continue; }

            gh api -X PUT "repos/$REPO/contents/$path" \
              -f message="chore: ADR claim $path landed in #$PR_NUMBER" \
              -f branch=coordination \
              -f sha="$sha" \
              -f content="$(printf '%s' "$updated" | base64 -w0)" \
              >/dev/null 2>&1 \
              && echo "promoted $path to landed" \
              || echo "::warning::could not promote $path"
          done

      - name: Sweep signal files out of preprod
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          FEATURE_BRANCH="${{ needs.gate.outputs.feature_branch }}"

          # Belt and braces. The cleanup above is supposed to leave preprod clean,
          # but a signal file that does reach preprod is invisible until it breaks
          # something far away: an inherited .harness-feature renames a future
          # session's branch, and every claude/ branch cut from preprod carries the
          # leak onward. Strip and warn rather than refuse: a stray file must
          # never block shipping, and the warning is what says something
          # upstream let it through.
          #
          # .release-description.md is deliberately NOT swept. On preprod it is not
          # a leak but the live /release trigger, and removing it would break
          # releasing. The release path sweeps it instead, where it is removed
          # by design anyway.
          # Forge decision record 0016.
          # The whole signal-file class, in both variants. Unlike
          # remove_signal_files above, which strips only what this workflow
          # created and so differs per variant, the sweep is a safety net:
          # --ignore-unmatch makes a file that never exists in a plain repo
          # free, and one membership is one less thing to drift.
          SWEEP=".pr-description.md .railway-url .harness-init .harness-feature"

          # Only sweep a tree this run actually created. gh pr merge may have
          # fallen back to --auto, and /review does not merge at all, so preprod is
          # not always ours to rewrite; the eventual merge sweeps it instead.
          # Same jq spelling as the merged-PR lookup earlier in this file.
          PR_NUMBER=$(gh pr list --head "$FEATURE_BRANCH" --base preprod --state all \
            --json number,state --jq 'map(select(.state=="MERGED")) | .[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            # An open PR is the expected state on the /review path and while an
            # auto-merge is pending; neither is worth a warning.
            OPEN_PR=$(gh pr list --head "$FEATURE_BRANCH" --base preprod --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$OPEN_PR" ]; then
              echo "PR #$OPEN_PR is still open; preprod is not this run's to sweep."
            else
              echo "::warning::No PR found for $FEATURE_BRANCH; skipping the preprod signal-file sweep."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          for attempt in 1 2 3; do
            git fetch origin preprod 2>/dev/null || true
            # No `|| true` here: if the checkout fails, the git rm and commit
            # below would act on the feature branch's tree instead of preprod's.
            git checkout -B preprod "origin/preprod" > /dev/null 2>&1 || { sleep "$attempt"; continue; }
            git rm -f --ignore-unmatch $SWEEP > /dev/null 2>&1 || true

            # Nothing staged means preprod was already clean, which is the common
            # case: no commit, no push, no noise in preprod's history.
            if git diff --cached --quiet; then
              echo "preprod carries no signal files."
              exit 0
            fi

            LEAKED=$(git diff --cached --name-only | tr '\n' ' ')
            git commit -q -m "chore: remove signal files"
            if git -c "http.https://github.com/.extraheader=" push origin preprod; then
              echo "::warning::Signal files reached preprod and were removed: $LEAKED"
              exit 0
            fi
            sleep "$attempt"
          done

          echo "::warning::Could not push the preprod signal-file sweep after 3 attempts."

      - name: Delete source claude/ branch
        run: git push origin --delete ${{ github.ref_name }} || true

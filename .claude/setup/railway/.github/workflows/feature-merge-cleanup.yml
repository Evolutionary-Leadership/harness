name: Clean up feature branch after merge to preprod

on:
  pull_request:
    types: [closed]
    branches: [preprod]

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract feature name
        id: feature
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          FEATURE_NAME="${BRANCH#feature/}"
          echo "name=$FEATURE_NAME" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Delete Railway environment
        env:
          RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_ACCOUNT_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Skipping: RAILWAY_ACCOUNT_TOKEN or RAILWAY_PROJECT_ID not set."
            exit 0
          fi

          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          gql() {
            local resp
            resp=$(curl -s -X POST "$API_URL" \
              -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"$1\"}") || true
            if echo "$resp" | jq . >/dev/null 2>&1; then
              echo "$resp"
            else
              echo '{"data":null}'
            fi
          }

          # Find the environment ID by name
          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty")

          if [ -z "$ENV_ID" ]; then
            echo "Warning: environment '$FEATURE_NAME' not found, may already be deleted."
            exit 0
          fi

          echo "Deleting Railway environment '$FEATURE_NAME' (ID: $ENV_ID)..."
          gql "mutation { environmentDelete(id: \\\"$ENV_ID\\\") }"
          echo "Railway environment '$FEATURE_NAME' deleted."

      - name: Delete feature branch
        run: |
          BRANCH="${{ steps.feature.outputs.branch }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
            || echo "Warning: branch may already be deleted."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The feature-context file (see .claude/HARNESS.md) lives only while a
      # feature is in flight, and so does .harness/env/<slug>.env, the
      # preview's own variables, whose environment the step above just
      # deleted. /to-preprod and its workflow remove both before the merge;
      # this step is the net for merges that bypassed /to-preprod (the GitHub
      # UI merge button, a manual git merge), so neither lingers on preprod.
      - name: Remove leftover feature context and preview variables from preprod
        run: |
          SLUG="${{ steps.feature.outputs.name }}"
          git clone --depth 1 --branch preprod \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" preprod-clone
          cd preprod-clone
          LEFT=""
          for FILE in ".harness/feature-context/${SLUG}.md" ".harness/journey/${SLUG}.md" ".harness/env/${SLUG}.env"; do
            [ -f "$FILE" ] && LEFT="$LEFT $FILE"
          done
          if [ -n "$LEFT" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q $LEFT
            git commit -m "chore: remove feature context for merged ${SLUG}"
            git push origin preprod \
              || echo "Warning: could not push context cleanup to preprod (branch protection?)."
          else
            echo "No feature context or preview variables to clean up."
          fi
          if git fetch -q --depth 1 origin coordination 2>/dev/null &&
            git cat-file -e "origin/coordination:features/${SLUG}.md" 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -q --detach origin/coordination
            git rm -q "features/${SLUG}.md"
            git commit -q -m "journey: ${SLUG} retired at the merge"
            git push -q origin HEAD:coordination \
              || echo "Warning: could not retire features/${SLUG}.md on coordination."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Provision Railway environment for feature branch

on:
  workflow_run:
    workflows: ["Create feature branch & merge claude/ into it"]
    types: [completed]

concurrency:
  # Queue, do not cancel. Cancelling mid-run can interrupt a Railway
  # GraphQL mutation between environmentCreate and the .railway-url
  # commit, leaving a stranded environment with no published URL.
  group: railway-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  provision-railway:
    # Two head-commit-message clauses skip provisioning/heal runs, both for
    # pushes that change nothing Railway needs to act on. Note they skip only
    # this workflow; Railway's own deployment trigger still watches the
    # feature branch and redeploys on any push to it.
    #
    # 1. `chore(context):` is the prefix the skills use for pure
    #    feature-context refreshes (see .claude/HARNESS.md).
    #
    # 2. MERGE_SIGNAL is the subject /to-preprod commits when it asks for the
    #    auto-merge to preprod. Such a push is a teardown, not a provisioning
    #    event: claude-to-preprod.yml is concurrently deleting the environment,
    #    stripping the signal files and merging the PR. Running anyway raced
    #    that cleanup and committed .railway-url back onto the PR head, which
    #    is how the file reached preprod and then main; and because the teardown
    #    deletes the environment first, a run whose existence check landed
    #    after the delete forked preprod into an environment nobody asked for.
    #
    #    /review's subject is deliberately NOT skipped. A review PR keeps its
    #    environment (claude-to-preprod.yml gates the teardown on the review
    #    flag), so it still wants provisioning and healing to run.
    #
    #    The literal is a contract between the /to-preprod skill that writes it
    #    and this guard that matches it, like the bootstrap foundation marker
    #    and the preflight result subject. It is spelled out inline rather
    #    than held in a variable because a job-level `if:` cannot read the
    #    `env` context, and a second copy for the checker to read would be a
    #    second thing to drift. scripts/check-template-overlay.mjs reads the
    #    prefixes straight out of this expression and fails the merge gate
    #    when the skill stops committing one of them.
    #    Forge decision record 0016.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(context):') &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore: trigger auto-merge to preprod')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      # Keep in sync with harness-railway.yml. Railway forks default to
      # US East unless every service-instance carries a region override.
      SERVICE_REGION: europe-west4-drams3a
      # Single visible knob for the object-storage bucket region. Feature
      # buckets are NOT created here: they are inherited from the preprod
      # environment's bucket (which harness-railway.yml creates in this
      # region), because Object Storage is not addressable via
      # project.services and a bucket cannot be moved after creation. This
      # value is surfaced for documentation/parity with harness-railway.yml
      # and is referenced by the region-pin step's warning output.
      BUCKET_REGION: ams
    steps:
      - name: Extract feature name from triggering branch
        id: feature
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          WITHOUT_PREFIX="${BRANCH#claude/}"
          CODENAME="${WITHOUT_PREFIX%-*}"
          # This is a workflow_run job: the repo is not checked out yet and the
          # claude/ branch may already be deleted by the bridge workflow. Read
          # .harness-feature from the triggering commit via the contents API.
          # Keep this validation identical to
          # .claude/scripts/resolve-feature-name.sh and the other workflows.
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SLUG="$(curl -fsS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.harness-feature?ref=$HEAD_SHA" \
            2>/dev/null | head -n1 | tr -d '[:space:]' || true)"
          if printf '%s' "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$' && [ "$SLUG" != preprod ] && [ "$SLUG" != dev ] && [ "$SLUG" != main ]; then FEATURE_NAME="$SLUG"; else FEATURE_NAME="$CODENAME"; fi
          echo "name=$FEATURE_NAME" >> "$GITHUB_OUTPUT"
          echo "branch=feature/$FEATURE_NAME" >> "$GITHUB_OUTPUT"

      - name: Check if Railway environment already exists
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        id: check
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          ENVS=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }\"}")

          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty" 2>/dev/null) || true

          if [ -n "$ENV_ID" ]; then
            echo "Railway environment '$FEATURE_NAME' already exists, skipping provisioning."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        with:
          ref: ${{ steps.feature.outputs.branch }}
          fetch-depth: 1

      - name: Create Railway environment and connect branch
        if: steps.check.outputs.exists != 'true' && env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          FEATURE_BRANCH="${{ steps.feature.outputs.branch }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          # POST a raw JSON payload, retrying when the response is not
          # valid JSON. Slow mutations (environmentCreate forks the whole
          # preprod environment and can take over a minute) sometimes come
          # back with a malformed body even though they succeeded
          # server-side; a single bad response must not be trusted.
          gql_post() {
            local payload="$1" resp
            for _try in 1 2 3; do
              resp=$(curl -s --max-time 120 -X POST "$API_URL" \
                -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload") || true
              if echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp"
                return 0
              fi
              sleep 5
            done
            echo '{"data":null}'
          }

          gql() {
            gql_post "{\"query\":\"$1\"}"
          }

          set_service_region() {
            local svc_id="$1"
            local env_id="$2"
            gql_post "$(jq -n \
              --arg sid "$svc_id" \
              --arg eid "$env_id" \
              --arg region "$SERVICE_REGION" \
              '{query: "mutation($sid: String!, $eid: String!, $region: String!) { serviceInstanceUpdate(serviceId: $sid, environmentId: $eid, input: { region: $region }) }", variables: {sid: $sid, eid: $eid, region: $region}}')" > /dev/null || true
          }

          # Generate a signing key into the named global variable given as $1.
          # The mask is emitted on the line after generation and BEFORE the
          # value is returned, so it cannot reach the run log through a later
          # jq payload. The result is assigned via printf -v rather than
          # echoed, because a command substitution would swallow the
          # ::add-mask:: line along with the value and Actions would never see
          # it. check-template-overlay.mjs enforces the generate-then-mask
          # pairing. See the forge's decision record 0007.
          gen_masked_secret() {
            local __out_var="$1"
            local __value
            __value=$(openssl rand -base64 32 | tr -d '\n')
            echo "::add-mask::$__value"
            printf -v "$__out_var" '%s' "$__value"
          }

          # Does an environment's app service carry a variable? Answers "no"
          # on any unreadable response, so the caller does nothing rather than
          # acting on an environment it could not inspect.
          env_has_var() {
            local env_id="$1" svc_id="$2" key="$3" resp
            resp=$(gql_post "$(jq -n \
              --arg pid "$PROJECT_ID" \
              --arg eid "$env_id" \
              --arg sid "$svc_id" \
              '{query: "query($pid: String!, $eid: String!, $sid: String!) { variables(projectId: $pid, environmentId: $eid, serviceId: $sid) }", variables: {pid: $pid, eid: $eid, sid: $sid}}')")
            echo "$resp" | jq -e --arg k "$key" '((.data.variables | type) == "object") and (.data.variables | has($k))' > /dev/null 2>&1
          }

          # 1. Get the preprod environment ID
          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          PREPROD_ENV_ID=$(echo "$ENVS" | jq -r '.data.environments.edges[].node | select(.name == "preprod") | .id')

          if [ -z "$PREPROD_ENV_ID" ]; then
            echo "Error: Could not find preprod environment"
            exit 1
          fi

          # 2. Create environment duplicated from preprod.
          #
          # Say something about the name length BEFORE the call. Railway
          # refuses environmentCreate for an over-long name with a bare
          #   {"errors":[{"message":"Error in name - Invalid input", ...}]}
          # which reads like a transient API fault, and the no-id path below
          # then used to spend 60 seconds polling for an environment the API
          # had already declined to create.
          #
          # This WARNS and does not refuse, deliberately. 34 characters was
          # rejected downstream and 26 and 27 provisioned, so the real
          # threshold is known only to lie somewhere in 28..34.
          # set-feature-name.sh mints at 27, the longest length measured to
          # work; refusing here at the same number would turn every unmeasured
          # length into a certain failure on this side too, when Railway might
          # well accept it. Railway decides, and the error path below reports
          # its answer with the length attached.
          RAILWAY_ENV_NAME_MAX=27
          if [ "${#FEATURE_NAME}" -gt "$RAILWAY_ENV_NAME_MAX" ]; then
            echo "::warning::Feature name '$FEATURE_NAME' is ${#FEATURE_NAME} characters, above the $RAILWAY_ENV_NAME_MAX that set-feature-name.sh mints. Railway may refuse it; if it does, the error below names this length. Rename with 'bash .claude/scripts/set-feature-name.sh <shorter-slug>' and push again."
          fi

          CREATE_RESPONSE=$(gql "mutation { environmentCreate(input: { name: \\\"$FEATURE_NAME\\\", projectId: \\\"$PROJECT_ID\\\", sourceEnvironmentId: \\\"$PREPROD_ENV_ID\\\" }) { id deploymentTriggers { edges { node { id branch } } } } }")

          ENV_ID=$(echo "$CREATE_RESPONSE" | jq -r '.data.environmentCreate.id // empty')
          if [ -z "$ENV_ID" ]; then
            # Railway answered and said no. That is not the malformed-response
            # case the polling fallback exists for, so report what it said
            # rather than waiting a minute to report that nothing appeared.
            CREATE_ERRS=$(echo "$CREATE_RESPONSE" | jq -r '[.errors[]?.message] | join("; ")' 2>/dev/null || true)
            if [ -n "$CREATE_ERRS" ]; then
              echo "::error::Railway refused to create environment '$FEATURE_NAME' (${#FEATURE_NAME} characters; set-feature-name.sh mints at most $RAILWAY_ENV_NAME_MAX): $CREATE_ERRS. An 'Error in name' here means the name is too long: rename the feature with 'bash .claude/scripts/set-feature-name.sh <shorter-slug>' and push again."
              exit 1
            fi
            # The create response can be malformed even though the
            # environment WAS created server-side (with preprod's deployment
            # trigger still pointing at preprod). Exiting 0 here would skip
            # the trigger update, region pin, and variable wiring, and
            # the preview would silently serve preprod code. Poll for the
            # environment by name and continue provisioning once found.
            echo "environmentCreate returned no id; polling for environment '$FEATURE_NAME'..."
            echo "$CREATE_RESPONSE" | jq . || true
            for i in 1 2 3 4 5 6; do
              sleep 10
              ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
              ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty")
              if [ -n "$ENV_ID" ]; then
                echo "Found environment '$FEATURE_NAME' ($ENV_ID) on poll $i/6."
                break
              fi
              echo "Environment '$FEATURE_NAME' not visible yet (poll $i/6)."
            done
            if [ -z "$ENV_ID" ]; then
              echo "::error::Railway environment '$FEATURE_NAME' (${#FEATURE_NAME} characters, cap $RAILWAY_ENV_NAME_MAX) was not created: environmentCreate returned no id, named no error, and the environment did not appear after 60s of polling."
              exit 1
            fi
          fi

          # 3. Update each deployment trigger to point to the feature
          # branch. Query the triggers by environment id instead of
          # reading them from the create response, which may have been
          # malformed (see the polling fallback above).
          TRIGGERS=$(gql "query { environment(id: \\\"$ENV_ID\\\") { deploymentTriggers { edges { node { id branch } } } } }")
          TRIGGER_IDS=$(echo "$TRIGGERS" | jq -r '.data.environment.deploymentTriggers.edges[].node.id // empty')
          for TRIGGER_ID in $TRIGGER_IDS; do
            gql "mutation { deploymentTriggerUpdate(id: \\\"$TRIGGER_ID\\\", input: { branch: \\\"$FEATURE_BRANCH\\\" }) { id } }"
          done

          # 3b. Wire DATABASE_URL and bucket credentials to app service
          # environmentCreate *should* inherit variables from preprod, but Railway
          # reference variables sometimes fail to resolve in forked environments.
          # Explicitly setting them ensures the app works on first deploy.
          # Build Railway reference variables at runtime so double braces
          # never appear literally in this YAML file.
          railref() { printf '\044'; printf '{'; printf '{%s}}' "$1"; }
          SERVICES_LIST=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }")
          APP_SERVICE_ID=$(echo "$SERVICES_LIST" | jq -r '[.data.project.services.edges[].node | select(.name | test("postgres|db|storage"; "i") | not)][0].id // empty')
          PG_SVC_NAME=$(echo "$SERVICES_LIST" | jq -r '[.data.project.services.edges[].node | select(.name | test("db|postgres"; "i"))][0].name // empty')
          PG_SVC_ID=$(echo "$SERVICES_LIST" | jq -r '[.data.project.services.edges[].node | select(.name | test("db|postgres"; "i"))][0].id // empty')
          PG_REF=$(railref "${PG_SVC_NAME}.DATABASE_URL")

          # Pin region for the forked feature environment. environmentCreate
          # *should* carry per-instance region from preprod, but inheritance is
          # not guaranteed, so set it explicitly.
          if [ -n "$APP_SERVICE_ID" ]; then
            set_service_region "$APP_SERVICE_ID" "$ENV_ID"
            echo "Pinned app service region to $SERVICE_REGION (feature env)"
          fi
          if [ -n "$PG_SVC_ID" ]; then
            set_service_region "$PG_SVC_ID" "$ENV_ID"
            echo "Pinned Postgres region to $SERVICE_REGION (feature env)"
          fi

          # Derive storage service name from Railway project name.
          # Object Storage doesn't appear in project.services GraphQL query.
          PROJECT_INFO=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { name } }")
          PROJECT_NAME_RAIL=$(echo "$PROJECT_INFO" | jq -r '.data.project.name // empty')
          STORAGE_SVC_NAME=""
          if [ -n "$PROJECT_NAME_RAIL" ]; then
            STORAGE_SVC_NAME="${PROJECT_NAME_RAIL}-storage"
          fi

          if [ -n "$APP_SERVICE_ID" ]; then
            # Wire DATABASE_URL (Postgres supports cross-service references)
            gql_post "$(jq -n \
              --arg pid "$PROJECT_ID" \
              --arg eid "$ENV_ID" \
              --arg sid "$APP_SERVICE_ID" \
              --arg dbref "$PG_REF" \
              '{query: "mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }", variables: {input: {projectId: $pid, environmentId: $eid, serviceId: $sid, variables: {"DATABASE_URL": $dbref}}}}')" > /dev/null
            echo "Set DATABASE_URL on app service for feature environment"

            # Wire bucket credentials via reference variables.
            # The bucket service exposes: BUCKET, ENDPOINT, REGION,
            # ACCESS_KEY_ID, SECRET_ACCESS_KEY. We set these as references
            # on the app service (same as Railway's "Add to Service").
            if [ -n "$STORAGE_SVC_NAME" ]; then
              BUCKET_REF=$(railref "${STORAGE_SVC_NAME}.BUCKET")
              ENDPOINT_REF=$(railref "${STORAGE_SVC_NAME}.ENDPOINT")
              ACCESSKEY_REF=$(railref "${STORAGE_SVC_NAME}.ACCESS_KEY_ID")
              SECRETKEY_REF=$(railref "${STORAGE_SVC_NAME}.SECRET_ACCESS_KEY")
              REGION_REF=$(railref "${STORAGE_SVC_NAME}.REGION")

              gql_post "$(jq -n \
                --arg pid "$PROJECT_ID" \
                --arg eid "$ENV_ID" \
                --arg sid "$APP_SERVICE_ID" \
                --arg bucket "$BUCKET_REF" \
                --arg endpoint "$ENDPOINT_REF" \
                --arg accesskey "$ACCESSKEY_REF" \
                --arg secretkey "$SECRETKEY_REF" \
                --arg region "$REGION_REF" \
                '{query: "mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }", variables: {input: {projectId: $pid, environmentId: $eid, serviceId: $sid, variables: {"AWS_S3_BUCKET_NAME": $bucket, "AWS_ENDPOINT_URL": $endpoint, "AWS_ACCESS_KEY_ID": $accesskey, "AWS_SECRET_ACCESS_KEY": $secretkey, "AWS_DEFAULT_REGION": $region}}}}')" > /dev/null
              echo "Set bucket credentials on app service for feature environment"
            fi

            # 3b-ii. Give this preview its own auth secret.
            # environmentCreate copies preprod's variables as literals, so a fresh
            # preview arrives holding preprod's BETTER_AUTH_SECRET. Replace it, so
            # the "unique per environment" rule the foundation states is
            # actually true, and a leaked preview key cannot forge preprod sessions.
            #
            # Gated on the key already being present. A project without the
            # standard technical foundation has no BETTER_AUTH_SECRET on preprod,
            # so its previews have nothing to rotate and this does nothing.
            # That presence check is why the /setup foundation marker never has
            # to reach this workflow.
            #
            # This whole step runs only on the create path (see the step's
            # `if:`), so a preview's secret is set once and later pushes to the
            # same branch leave it alone. Rotating on every push would log a
            # reviewer out mid review. Forge decision record 0007.
            # Unlike the bootstrap workflow's read, this one fails towards
            # doing NOTHING: an unreadable response leaves the preview with
            # preprod's inherited secret, which is degraded but harmless, whereas
            # rotating on a bad read could disturb an environment we could not
            # actually inspect.
            if env_has_var "$ENV_ID" "$APP_SERVICE_ID" BETTER_AUTH_SECRET; then
              gen_masked_secret FEATURE_AUTH_SECRET
              gql_post "$(jq -n \
                --arg pid "$PROJECT_ID" \
                --arg eid "$ENV_ID" \
                --arg sid "$APP_SERVICE_ID" \
                --arg secret "$FEATURE_AUTH_SECRET" \
                '{query: "mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }", variables: {input: {projectId: $pid, environmentId: $eid, serviceId: $sid, variables: {"BETTER_AUTH_SECRET": $secret}}}}')" > /dev/null
              # Name only. Never the value.
              echo "Set BETTER_AUTH_SECRET on app service for feature environment (fresh value, not preprod's)"
            else
              echo "No BETTER_AUTH_SECRET inherited from preprod; nothing to rotate for this feature environment."
            fi
          fi

          # 3c. Redeploy the app service from the feature branch
          # environmentCreate duplicates the preprod environment and immediately
          # queues a deployment using the *old* (preprod) triggers. By the time
          # we update the triggers above, that first deployment is already
          # in flight with preprod code. Explicitly redeploying ensures the
          # feature branch code is what actually runs.
          # Only the app service needs redeployment. Postgres and storage
          # are managed services that don't pull from git branches.
          if [ -n "$APP_SERVICE_ID" ]; then
            echo "Triggering redeploy for app service $APP_SERVICE_ID in environment $ENV_ID"
            gql "mutation { serviceInstanceRedeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$APP_SERVICE_ID\\\") }" || true
          fi

          # 4. Eagerly ensure a service domain exists. The publish step
          # below also does get-or-create, but seeding it here means the
          # domain is reachable as soon as the deployment finishes.
          # environmentCreate duplicates preprod's domain, so we check for an
          # inherited domain before creating a new one to avoid duplicates.
          if [ -n "$APP_SERVICE_ID" ]; then
            EXISTING_DOMAIN=$(gql "query { domains(projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$APP_SERVICE_ID\\\") { serviceDomains { domain } } }" \
              | jq -r '.data.domains.serviceDomains[0].domain // empty' 2>/dev/null) || true

            if [ -n "$EXISTING_DOMAIN" ]; then
              echo "Using existing domain inherited from preprod: $EXISTING_DOMAIN"
            else
              gql "mutation { serviceDomainCreate(input: { serviceId: \\\"$APP_SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\" }) { domain } }" >/dev/null || true
            fi
          fi

      - name: Repoint deployment triggers to feature branch (heal)
        # Always runs when secrets are present, regardless of whether the
        # create step ran or was skipped (exists=true), analogous to the
        # URL publish heal below. environmentCreate forks preprod's deployment
        # trigger, so a half-provisioned environment (older harness
        # versions, or a create run that died between environmentCreate
        # and deploymentTriggerUpdate) keeps serving preprod code while
        # looking healthy. Any trigger not pointing at feature/<name> is
        # repointed here, followed by a redeploy of the app service so
        # the running deployment matches the connected branch. Idempotent:
        # no-op when all triggers already point at the feature branch.
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          FEATURE_BRANCH="${{ steps.feature.outputs.branch }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          # Same retry-hardened helper as the create step: never trust a
          # single malformed response from a slow Railway mutation.
          gql_post() {
            local payload="$1" resp
            for _try in 1 2 3; do
              resp=$(curl -s --max-time 120 -X POST "$API_URL" \
                -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload") || true
              if echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp"
                return 0
              fi
              sleep 5
            done
            echo '{"data":null}'
          }

          gql() {
            gql_post "{\"query\":\"$1\"}"
          }

          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty" 2>/dev/null) || true
          if [ -z "$ENV_ID" ]; then
            echo "::warning::No Railway environment found for '$FEATURE_NAME'; nothing to heal."
            exit 0
          fi

          TRIGGERS=$(gql "query { environment(id: \\\"$ENV_ID\\\") { deploymentTriggers { edges { node { id branch } } } } }")
          STALE_IDS=$(echo "$TRIGGERS" | jq -r --arg b "$FEATURE_BRANCH" '.data.environment.deploymentTriggers.edges[].node | select(.branch != $b) | .id' 2>/dev/null) || true
          if [ -z "$STALE_IDS" ]; then
            echo "All deployment triggers already point at $FEATURE_BRANCH."
            exit 0
          fi

          for TRIGGER_ID in $STALE_IDS; do
            gql "mutation { deploymentTriggerUpdate(id: \\\"$TRIGGER_ID\\\", input: { branch: \\\"$FEATURE_BRANCH\\\" }) { id } }" > /dev/null
            echo "Repointed deployment trigger $TRIGGER_ID to $FEATURE_BRANCH"
          done

          # The stale trigger means the current deployment was built from
          # the wrong branch; redeploy the app service so the running code
          # matches. Postgres and storage are managed services that do not
          # pull from git, so only the app service needs it.
          SERVICES=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }")
          APP_SERVICE_ID=$(echo "$SERVICES" | jq -r '[.data.project.services.edges[].node | select(.name | test("postgres|db|storage"; "i") | not)][0].id // empty' 2>/dev/null) || true
          if [ -n "$APP_SERVICE_ID" ]; then
            gql "mutation { serviceInstanceRedeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$APP_SERVICE_ID\\\") }" > /dev/null || true
            echo "Redeployed app service from $FEATURE_BRANCH"
          fi

      - name: Pin service region to Europe and redeploy
        # Always runs when secrets are present, regardless of whether the
        # create step ran or was skipped (exists=true), analogous to the
        # trigger-repoint and URL-publish heal steps. The create step pins
        # the region only on first provision; an environment that already
        # existed (older harness, or a create run that died before its
        # region pin) would otherwise keep whatever region it was forked
        # with. serviceInstanceUpdate is an idempotent config write, so
        # re-pinning an already-correct service is a no-op; the app is
        # redeployed only when its region actually had to change.
        #
        # Bucket note: Railway Object Storage is NOT addressable via
        # project.services, so a feature bucket's region cannot be read or
        # re-pinned here. Feature buckets inherit their region from the preprod
        # environment's bucket, which harness-railway.yml creates in
        # BUCKET_REGION (ams). A bucket cannot be moved after creation, so
        # the preprod bucket is the durable control for bucket region; this
        # step governs only the app + Postgres services. We deliberately
        # ship no untested storage-region mutation here. See
        # claude/HARNESS.md "Region default".
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          # Same retry-hardened helper as the create step: never trust a
          # single malformed response from a slow Railway mutation.
          gql_post() {
            local payload="$1" resp
            for _try in 1 2 3; do
              resp=$(curl -s --max-time 120 -X POST "$API_URL" \
                -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload") || true
              if echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp"
                return 0
              fi
              sleep 5
            done
            echo '{"data":null}'
          }

          gql() {
            gql_post "{\"query\":\"$1\"}"
          }

          set_service_region() {
            local svc_id="$1"
            local env_id="$2"
            gql_post "$(jq -n \
              --arg sid "$svc_id" \
              --arg eid "$env_id" \
              --arg region "$SERVICE_REGION" \
              '{query: "mutation($sid: String!, $eid: String!, $region: String!) { serviceInstanceUpdate(serviceId: $sid, environmentId: $eid, input: { region: $region }) }", variables: {sid: $sid, eid: $eid, region: $region}}')" > /dev/null || true
          }

          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty" 2>/dev/null) || true
          if [ -z "$ENV_ID" ]; then
            echo "::warning::No Railway environment found for '$FEATURE_NAME'; cannot pin region."
            exit 0
          fi

          SERVICES=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }")
          APP_SERVICE_ID=$(echo "$SERVICES" | jq -r '[.data.project.services.edges[].node | select(.name | test("postgres|db|storage"; "i") | not)][0].id // empty' 2>/dev/null) || true
          PG_SVC_ID=$(echo "$SERVICES" | jq -r '[.data.project.services.edges[].node | select(.name | test("db|postgres"; "i"))][0].id // empty' 2>/dev/null) || true

          # Read the current per-instance region so we only redeploy the app
          # when the region actually has to change. If the query field is
          # unavailable (schema drift) the read returns empty, and we fall
          # back to pinning + redeploying, which is the safe default.
          INSTANCES=$(gql "query { environment(id: \\\"$ENV_ID\\\") { serviceInstances { edges { node { serviceId region } } } } }")
          APP_REGION=$(echo "$INSTANCES" | jq -r --arg sid "$APP_SERVICE_ID" '.data.environment.serviceInstances.edges[].node | select(.serviceId == $sid) | .region // empty' 2>/dev/null) || true
          PG_REGION=$(echo "$INSTANCES" | jq -r --arg sid "$PG_SVC_ID" '.data.environment.serviceInstances.edges[].node | select(.serviceId == $sid) | .region // empty' 2>/dev/null) || true

          APP_CHANGED=false
          if [ -n "$APP_SERVICE_ID" ] && [ "$APP_REGION" != "$SERVICE_REGION" ]; then
            set_service_region "$APP_SERVICE_ID" "$ENV_ID"
            echo "Pinned app service region to $SERVICE_REGION (feature env '$FEATURE_NAME', was '${APP_REGION:-unknown}')"
            APP_CHANGED=true
          elif [ -n "$APP_SERVICE_ID" ]; then
            echo "App service already in $SERVICE_REGION (feature env '$FEATURE_NAME'); no change."
          fi

          if [ -n "$PG_SVC_ID" ] && [ "$PG_REGION" != "$SERVICE_REGION" ]; then
            set_service_region "$PG_SVC_ID" "$ENV_ID"
            echo "Pinned Postgres region to $SERVICE_REGION (feature env '$FEATURE_NAME', was '${PG_REGION:-unknown}')"
          elif [ -n "$PG_SVC_ID" ]; then
            echo "Postgres already in $SERVICE_REGION (feature env '$FEATURE_NAME'); no change."
          fi

          # Object Storage is not in project.services, so the feature
          # bucket's region cannot be verified or re-pinned here. It is
          # inherited from the preprod bucket (created in BUCKET_REGION=$BUCKET_REGION)
          # and cannot be moved after creation.
          echo "Bucket region inherited from preprod (BUCKET_REGION=$BUCKET_REGION); not re-pinnable per feature."

          # A region change only takes effect on the next deployment, so
          # redeploy the app when its region changed. Postgres and storage
          # are managed services that do not pull from git.
          if [ "$APP_CHANGED" = true ] && [ -n "$APP_SERVICE_ID" ]; then
            gql "mutation { serviceInstanceRedeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$APP_SERVICE_ID\\\") }" > /dev/null || true
            echo "Redeployed app service so the new region takes effect."
          fi

      - name: Apply this feature's own variables
        # Railway forks every feature environment from preprod, variables
        # included, and a session holds no Railway credential, so a value
        # meant for one preview alone (an experiment behind a flag, an
        # undocumented field to try) had no way in: the only choice was to
        # hard-code it on a branch never meant to merge. A feature branch now
        # commits .harness/env/<name>.env, KEY=value literals, and this step
        # sets them on that feature's app service. Always runs when secrets
        # are present, create path or not, because the file usually arrives
        # after the naming push that provisioned the environment, and a push
        # that touches only .harness/ starts no Railway deploy of its own.
        #
        # Literals only, and never a secret: the file is committed. Keys the
        # harness or Railway own are refused, a reference is refused, and no
        # value is ever printed, only keys. It upserts only keys whose value
        # differs from the environment's, and Railway redeploys the app on the
        # upsert, so an unchanged file costs a read and no deploy.
        # claude-to-preprod.yml strips the file with .railway-url on the merge
        # path, and feature-merge-cleanup.yml removes one that reached preprod
        # anyway. Forge decision record 0043.
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          FEATURE_BRANCH="${{ steps.feature.outputs.branch }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"
          FILE=".harness/env/$FEATURE_NAME.env"

          # env_literals <file>: the file's KEY=value lines as one JSON object.
          # A value is everything after the first '=', less one surrounding
          # pair of matching quotes; nothing else is dotenv-parsed. Warnings
          # name a line number or a key, never a value, and collect in $NOTES
          # because stdout is the JSON; the step prints them afterwards, on
          # stdout, where Actions reads its annotations. The reference opener
          # is built at runtime so double braces never appear literally here.
          NOTES=$(mktemp)
          env_literals() {
            local file="$1" n=0 line key value out='{}' ref_open
            ref_open=$(printf '\044{{')
            while IFS= read -r line || [ -n "$line" ]; do
              n=$((n + 1))
              line=${line%$'\r'}
              line=${line#"${line%%[![:space:]]*}"}
              case "$line" in
                "" | "#"*) continue ;;
                "export "*) line=${line#export } ;;
              esac
              if ! [[ "$line" =~ ^([A-Z_][A-Z0-9_]*)=(.*)$ ]]; then
                echo "::warning::$file line $n is not KEY=value; skipped." >> "$NOTES"
                continue
              fi
              key=${BASH_REMATCH[1]}
              value=${BASH_REMATCH[2]}
              case "$key" in
                DATABASE_URL | PORT | BETTER_AUTH_SECRET | AWS_* | RAILWAY_*)
                  echo "::warning::$key is set by the harness or by Railway, never by $file; skipped." >> "$NOTES"
                  continue
                  ;;
              esac
              case "$value" in
                \"*\") value=${value#\"}; value=${value%\"} ;;
                \'*\') value=${value#\'}; value=${value%\'} ;;
              esac
              case "$value" in
                *"$ref_open"*)
                  echo "::warning::$key is a reference; $file carries literals only, so it is skipped." >> "$NOTES"
                  continue
                  ;;
              esac
              out=$(jq -c --arg k "$key" --arg v "$value" '. + {($k): $v}' <<< "$out")
            done < "$file"
            printf '%s\n' "$out"
          }

          if [ ! -f "$FILE" ]; then
            echo "No $FILE on $FEATURE_BRANCH; this preview carries preprod's variables only."
            exit 0
          fi
          WANT=$(env_literals "$FILE")
          cat "$NOTES"
          rm -f "$NOTES"
          if [ "$WANT" = '{}' ]; then
            echo "$FILE sets nothing this workflow may apply."
            exit 0
          fi

          # Same retry-hardened helper as the create step: never trust a
          # single malformed response from a slow Railway mutation.
          gql_post() {
            local payload="$1" resp
            for _try in 1 2 3; do
              resp=$(curl -s --max-time 120 -X POST "$API_URL" \
                -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload") || true
              if echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp"
                return 0
              fi
              sleep 5
            done
            echo '{"data":null}'
          }

          gql() {
            gql_post "{\"query\":\"$1\"}"
          }

          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty" 2>/dev/null) || true
          if [ -z "$ENV_ID" ]; then
            echo "::warning::No Railway environment found for '$FEATURE_NAME'; $FILE not applied."
            exit 0
          fi
          SERVICES=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }")
          APP_SERVICE_ID=$(echo "$SERVICES" | jq -r '[.data.project.services.edges[].node | select(.name | test("postgres|db|storage"; "i") | not)][0].id // empty' 2>/dev/null) || true
          if [ -z "$APP_SERVICE_ID" ]; then
            echo "::warning::No app service found in '$FEATURE_NAME'; $FILE not applied."
            exit 0
          fi

          # Read before writing, and fail towards doing nothing: an unreadable
          # environment is not one to change blind.
          HAVE=$(gql_post "$(jq -n \
            --arg pid "$PROJECT_ID" \
            --arg eid "$ENV_ID" \
            --arg sid "$APP_SERVICE_ID" \
            '{query: "query($pid: String!, $eid: String!, $sid: String!) { variables(projectId: $pid, environmentId: $eid, serviceId: $sid) }", variables: {pid: $pid, eid: $eid, sid: $sid}}')" \
            | jq -c 'if (.data.variables | type) == "object" then .data.variables else empty end' 2>/dev/null) || true
          if [ -z "$HAVE" ]; then
            echo "::warning::Could not read the variables of '$FEATURE_NAME'; $FILE not applied."
            exit 0
          fi
          CHANGED=$(jq -cn --argjson want "$WANT" --argjson have "$HAVE" '$want | with_entries(select($have[.key] != .value))')
          if [ "$CHANGED" = '{}' ]; then
            echo "Every variable in $FILE is already set on '$FEATURE_NAME'."
            exit 0
          fi

          RESP=$(gql_post "$(jq -n \
            --arg pid "$PROJECT_ID" \
            --arg eid "$ENV_ID" \
            --arg sid "$APP_SERVICE_ID" \
            --argjson vars "$CHANGED" \
            '{query: "mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }", variables: {input: {projectId: $pid, environmentId: $eid, serviceId: $sid, variables: $vars}}}')")
          if echo "$RESP" | jq -e '(.errors | length) > 0' > /dev/null 2>&1; then
            echo "::warning::Railway refused the variables from $FILE: $(echo "$RESP" | jq -r '[.errors[].message] | join("; ")')"
            exit 0
          fi
          # Keys only. Never the values.
          echo "Set $(echo "$CHANGED" | jq -r 'keys | join(", ")') on the app service of '$FEATURE_NAME' from $FILE; Railway redeploys it with them."

      - name: Publish Railway preview URL to feature branch
        # Always runs when secrets are present, regardless of whether the
        # create step ran or was skipped (exists=true).
        #
        # Idempotent by CONTENT, not by presence. "Published" means the file
        # names the environment THIS run resolved, not merely that a file is
        # there. A presence check cannot tell a URL this branch published from
        # one it inherited: a branch cut from a preprod that wrongly carries
        # .railway-url would keep the previous feature's URL forever, and every
        # reader would silently target an environment that no longer exists.
        # Comparing content is what repairs such a branch on its first run.
        #
        # Self-healing: a stranded environment left by a cancelled or
        # half-provisioned run recovers on the next trigger for the same branch.
        #
        # Forge decision record 0016.
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          FEATURE_BRANCH="${{ steps.feature.outputs.branch }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          # What the branch currently claims, for the comparisons below.
          CURRENT_URL=$(head -n1 .railway-url 2>/dev/null | tr -d '[:space:]' || true)

          # Same retry-hardened helper as the create step: never trust a
          # single malformed response from a slow Railway mutation.
          gql() {
            local resp
            for _try in 1 2 3; do
              resp=$(curl -s --max-time 120 -X POST "$API_URL" \
                -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"query\":\"$1\"}") || true
              if echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp"
                return 0
              fi
              sleep 5
            done
            echo '{"data":null}'
          }

          # Look up the env id by feature name.
          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id // empty" 2>/dev/null) || true
          # An unresolvable lookup leaves whatever is on the branch untouched
          # and warns: never delete a URL we merely failed to confirm. A
          # transient API blip must not cost a working link. This is the same
          # fail-toward-doing-nothing direction env_has_var takes, and
          # deliberately the opposite of harness-railway.yml's, for the reason
          # that workflow documents.
          if [ -z "$ENV_ID" ]; then
            echo "::warning::No Railway environment found for '$FEATURE_NAME'; create step likely failed. Leaving any existing .railway-url alone."
            exit 0
          fi

          # Find the app service (filter out managed Postgres/storage).
          SERVICES=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }")
          APP_SERVICE_ID=$(echo "$SERVICES" | jq -r '[.data.project.services.edges[].node | select(.name | test("postgres|db|storage"; "i") | not)][0].id // empty' 2>/dev/null) || true
          if [ -z "$APP_SERVICE_ID" ]; then
            echo "::warning::No app service found in project; leaving any existing .railway-url alone."
            exit 0
          fi

          # Get-or-create the service domain. environmentCreate inherits
          # preprod's domain, so check first to avoid duplicates.
          EXISTING_DOMAIN=$(gql "query { domains(projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$APP_SERVICE_ID\\\") { serviceDomains { domain } } }" \
            | jq -r '.data.domains.serviceDomains[0].domain // empty' 2>/dev/null) || true
          if [ -n "$EXISTING_DOMAIN" ]; then
            DOMAIN="$EXISTING_DOMAIN"
          else
            DOMAIN_RESPONSE=$(gql "mutation { serviceDomainCreate(input: { serviceId: \\\"$APP_SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\" }) { domain } }") || true
            DOMAIN=$(echo "$DOMAIN_RESPONSE" | jq -r '.data.serviceDomainCreate.domain // empty' 2>/dev/null) || true
          fi
          if [ -z "$DOMAIN" ]; then
            echo "::warning::Could not get or create a Railway domain; leaving any existing .railway-url alone."
            exit 0
          fi
          DEPLOY_URL="https://$DOMAIN"

          # The resolved URL is now known, so "already published" can finally
          # be asked properly. Equal means nothing to do; different or absent
          # means this branch is carrying an inherited or stale URL and must
          # be corrected.
          if [ "$CURRENT_URL" = "$DEPLOY_URL" ]; then
            echo "Already published: $DEPLOY_URL"
            exit 0
          fi
          if [ -n "$CURRENT_URL" ]; then
            echo "::warning::.railway-url named $CURRENT_URL, which is not this environment's domain. Republishing as $DEPLOY_URL."
          fi

          # Is the environment this URL names still there? Asked again, now,
          # because minutes can pass between the lookup above and this push:
          # environmentCreate forks the whole preprod environment and the
          # deployment wait that follows is slower still.
          #
          # On the merge path claude-to-preprod.yml deletes the environment
          # BEFORE it strips the signal files and opens the merge, so an
          # environment that resolved a moment ago and is gone now means a
          # to-preprod merge is in flight. Publishing into that is how
          # .railway-url landed on the PR head as a github-actions[bot] commit:
          # GitHub does not run a pull_request workflow for a bot-token push,
          # so the merge gate polled a head that could never go green and timed
          # out reporting a CI failure that had not happened.
          #
          # /review keeps its environment (the teardown is gated on the review
          # flag), so this never refuses a review preview its URL. The
          # workflow-level skip on 'chore: trigger auto-merge to preprod'
          # covers the push that ASKS for the merge; this covers a provisioning
          # run that was already in flight when the merge started, which the
          # subject-line guard cannot see. Forge decision record 0041.
          env_gone() {
            local envs
            envs=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
            # Fail towards publishing: an unreadable response is not evidence
            # of a teardown, and abandoning a good URL on an API blip is the
            # cost this direction refuses to pay.
            echo "$envs" | jq -e '.data.environments.edges' > /dev/null 2>&1 || return 1
            ! echo "$envs" | jq -e --arg n "$FEATURE_NAME" \
              '[.data.environments.edges[].node | select(.name == $n)] | length > 0' > /dev/null 2>&1
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Refetch-reset-retry, the same shape claude-to-preprod.yml's cleanup
          # uses, and deliberately not a rebase. Rebasing a "set the URL to X"
          # commit onto a branch whose file says Y conflicts, and the case
          # where the branch says Y is exactly the one this step now exists to
          # repair: the old loop could only abort and give up on it. Rewriting
          # the file on top of whatever the branch currently holds cannot
          # conflict, and the value is authoritative because it came from the
          # live API moments ago.
          for attempt in 1 2 3 4 5; do
            if env_gone; then
              echo "::warning::Railway environment '$FEATURE_NAME' was deleted while this run was provisioning; a merge to preprod is tearing it down. Not publishing $DEPLOY_URL."
              exit 0
            fi

            git fetch origin "$FEATURE_BRANCH" || true

            # Concede only to a run that published THIS url. Conceding to any
            # file at all is how a stale value survived: a queued earlier run
            # holding the previous feature's URL would win the race and this
            # run would walk away leaving the lie in place.
            REMOTE_URL=$(git show "origin/$FEATURE_BRANCH:.railway-url" 2>/dev/null \
              | head -n1 | tr -d '[:space:]' || true)
            if [ "$REMOTE_URL" = "$DEPLOY_URL" ]; then
              echo "Branch already has $DEPLOY_URL (queued earlier run won the race)."
              exit 0
            fi

            # Not `|| true`: pushing from a HEAD that was never reset onto
            # the branch tip would carry this run's checkout onto the feature
            # branch. The replaced rebase failed safe via --abort; this must
            # too, by retrying rather than pushing.
            git reset --hard "origin/$FEATURE_BRANCH" > /dev/null 2>&1 || { sleep "$attempt"; continue; }
            echo "$DEPLOY_URL" > .railway-url
            git add -f .railway-url
            git commit -m "chore: add Railway preview URL" > /dev/null 2>&1 || true
            if git push origin "HEAD:$FEATURE_BRANCH"; then
              echo "Published $DEPLOY_URL"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "::warning::Could not push .railway-url after 5 attempts. Fetch it manually: git fetch origin $FEATURE_BRANCH && git show origin/$FEATURE_BRANCH:.railway-url"

      - name: Wait for Railway deployment
        if: env.RAILWAY_ACCOUNT_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          PROJECT_ID="$RAILWAY_PROJECT_ID"
          API_URL="https://backboard.railway.com/graphql/v2"

          # Same retry-hardened helper as the create step: never trust a
          # single malformed response from a slow Railway mutation.
          gql() {
            local resp
            for _try in 1 2 3; do
              resp=$(curl -s --max-time 120 -X POST "$API_URL" \
                -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"query\":\"$1\"}") || true
              if echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp"
                return 0
              fi
              sleep 5
            done
            echo '{"data":null}'
          }

          # Find the environment ID for this feature
          ENVS=$(gql "query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }")
          ENV_ID=$(echo "$ENVS" | jq -r ".data.environments.edges[].node | select(.name == \"$FEATURE_NAME\") | .id" 2>/dev/null) || true

          if [ -z "$ENV_ID" ]; then
            echo "Could not find Railway environment for '$FEATURE_NAME', skipping deployment wait"
            exit 0
          fi

          # Find the app service ID (filter out managed services like Postgres/storage)
          SERVICES=$(gql "query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }")
          SERVICE_ID=$(echo "$SERVICES" | jq -r '[.data.project.services.edges[].node | select(.name | test("postgres|db|storage"; "i") | not)][0].id // empty' 2>/dev/null) || true

          if [ -z "$SERVICE_ID" ]; then
            echo "Could not find any services, skipping deployment wait"
            exit 0
          fi

          # Poll for deployment status (max 3 minutes)
          echo "Waiting for Railway deployment to complete..."
          for i in $(seq 1 18); do
            sleep 10
            RESULT=$(gql "query { deployments(input: { projectId: \\\"$PROJECT_ID\\\", serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\" }, first: 1) { edges { node { id status } } } }")
            STATUS=$(echo "$RESULT" | jq -r '.data.deployments.edges[0].node.status // empty' 2>/dev/null) || true
            echo "  Status: $STATUS (check $i/18)"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Railway deployment succeeded!"
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              echo "::warning::Railway deployment $STATUS"
              exit 0
            fi
          done

          echo "::warning::Timed out waiting for Railway deployment (3 minutes)"

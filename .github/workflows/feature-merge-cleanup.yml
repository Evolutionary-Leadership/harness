name: Clean up feature branch after merge to preprod

on:
  pull_request:
    types: [closed]
    branches: [preprod]

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete feature branch
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
            || echo "Warning: branch may already be deleted."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The feature-context file and the journey record (see
      # .claude/HARNESS.md) live only while a feature is in flight.
      # /to-preprod deletes both before triggering the merge; this step is
      # the net for merges that bypassed /to-preprod (the GitHub UI merge
      # button, a manual git merge), so neither lingers on preprod, and the
      # coordination record a skipped retirement left behind goes too.
      - name: Remove leftover feature context and journey record
        run: |
          SLUG="${{ github.event.pull_request.head.ref }}"
          SLUG="${SLUG#feature/}"
          git clone --depth 1 --branch preprod \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" preprod-clone
          cd preprod-clone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LEFT=""
          for FILE in ".harness/feature-context/${SLUG}.md" ".harness/journey/${SLUG}.md"; do
            [ -f "$FILE" ] && LEFT="$LEFT $FILE"
          done
          if [ -n "$LEFT" ]; then
            git rm -q $LEFT
            git commit -m "chore: remove feature context for merged ${SLUG}"
            git push origin preprod \
              || echo "Warning: could not push context cleanup to preprod (branch protection?)."
          else
            echo "No feature context or journey record to clean up."
          fi
          if git fetch -q --depth 1 origin coordination 2>/dev/null &&
            git cat-file -e "origin/coordination:features/${SLUG}.md" 2>/dev/null; then
            git checkout -q --detach origin/coordination
            git rm -q "features/${SLUG}.md"
            git commit -q -m "journey: ${SLUG} retired at the merge"
            git push -q origin HEAD:coordination \
              || echo "Warning: could not retire features/${SLUG}.md on coordination."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

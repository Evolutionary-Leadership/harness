name: Release to production

on:
  push:
    branches:
      - preprod
    paths:
      - '.release-description.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3). Leave empty to read from .release-description.md.'
        required: false

concurrency:
  group: preprod-write
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: remove release signal file')"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Parse release metadata
        id: release
        run: |
          if [ ! -f .release-description.md ]; then
            # workflow_dispatch without signal file, use input version
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::No .release-description.md and no version input. Nothing to release."
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "type=patch" >> "$GITHUB_OUTPUT"

            # Generate minimal release body from git log
            LAST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "v0.0.0")
            echo "## Release $VERSION" > /tmp/release-body.md
            echo "" >> /tmp/release-body.md
            git log "$LAST_TAG"..origin/preprod --oneline --no-merges >> /tmp/release-body.md || true
            exit 0
          fi

          VERSION=$(sed -n '/^---$/,/^---$/{ /^version:/{ s/^version: *//; p; } }' .release-description.md)
          TYPE=$(sed -n '/^---$/,/^---$/{ /^type:/{ s/^type: *//; p; } }' .release-description.md)
          CLEANUP_BRANCH=$(sed -n '/^---$/,/^---$/{ /^cleanup-branch:/{ s/^cleanup-branch: *//; p; } }' .release-description.md)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "cleanup_branch=$CLEANUP_BRANCH" >> "$GITHUB_OUTPUT"

          # Extract body (everything after second ---)
          awk 'BEGIN{c=0} /^---$/{c++; next} c>=2{print}' .release-description.md > /tmp/release-body.md

      - name: Check the downstream release notes
        run: |
          set -euo pipefail

          # The template repo publishes its own release notes, written for
          # downstream projects rather than for this repo, from
          # release-notes/<version>.md. The sync composes and publishes it;
          # this is where a mistake is still cheap to fix, before preprod moves.
          #
          # Both a malformed and a missing note fail the release. Malformed
          # because the sync would reject it later, after main has already
          # moved. Missing because a release that publishes no note leaves
          # the template repo carrying new content under the previous
          # release, which is what happened at 0.7.2: this step warned, the
          # release shipped, and the releases page sat a version behind
          # until somebody noticed. The note is generated from the changelog
          # and migration range now, so a missing one means generation was
          # skipped rather than that anyone forgot to write prose.
          #
          # Skips itself where VERSION or the composer is absent, so this
          # step stays harmless in the base template's copy of this file,
          # which no downstream scaffold can satisfy.
          #
          # Forge decision records 0020 and 0023.
          if [ ! -f VERSION ] || [ ! -f scripts/compose-release-notes.mjs ]; then
            exit 0
          fi

          VERSION=$(tr -d '[:space:]' < VERSION)
          NOTES="release-notes/${VERSION}.md"

          if [ ! -f "${NOTES}" ]; then
            echo "::error::${NOTES} is missing, so the template repo would sync new content and publish no release. Generate it: node scripts/release-notes-brief.mjs --version ${VERSION}, then compose the note per release-notes/README.md."
            exit 1
          fi

          if ! node scripts/compose-release-notes.mjs --notes "${NOTES}" > /dev/null; then
            echo "::error::${NOTES} is malformed; fix it before releasing. Rules: release-notes/README.md."
            exit 1
          fi
          echo "Downstream release note for ${VERSION} is valid." >> "$GITHUB_STEP_SUMMARY"


      - name: Remove signal file
        if: hashFiles('.release-description.md') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin preprod || true

          # This commit is what keeps main clean. It already had to remove the
          # release signal file; sweeping the rest of the class in the same
          # commit costs nothing and is the last point before preprod's tree
          # becomes main's. A signal file on main is inherited by every
          # scaffold and every branch cut from it afterwards.
          #
          # The subject below is a parsed literal: this job's own if: guard
          # skips runs whose head commit carries it, which is what stops this
          # push from re-triggering the release. Widening what the step removes
          # must not change what the commit says.
          #
          # Forge decision record 0016.
          git rm -f .release-description.md
          git rm -f --ignore-unmatch \
            .pr-description.md .railway-url .harness-init .harness-feature > /dev/null 2>&1 || true
          # Exclude via git's pathspec rather than piping through grep: a grep
          # that matches nothing exits 1, and under a shell with pipefail (any
          # step declaring `shell: bash`, or a repo setting defaults.run.shell)
          # that aborts the step before the commit below, failing every release
          # in the normal case where nothing leaked.
          LEAKED=$(git diff --cached --name-only -- ':!.release-description.md' | tr '\n' ' ')
          [ -z "$LEAKED" ] || echo "::warning::Signal files reached preprod and were removed before the release: $LEAKED"
          git commit -m "chore: remove release signal file"

          for i in 1 2 3; do
            if git push origin preprod; then
              break
            fi
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase origin preprod || true
            sleep "$i"
          done

      - name: Create release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          EXISTING=$(gh pr list --head preprod --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
            gh pr edit "$PR_NUMBER" --title "Release $VERSION" --body-file /tmp/release-body.md
          else
            PR_URL=$(gh pr create --base main --head preprod --title "Release $VERSION" --body-file /tmp/release-body.md)
            PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"

          # Try auto-merge first (handles repos with required status checks)
          if gh pr merge "$PR_NUMBER" --auto --merge 2>/dev/null; then
            echo "Release PR #$PR_NUMBER set to auto-merge once checks pass."
          else
            # No branch protection, merge immediately with retry
            for i in 1 2 3 4; do
              if gh pr merge "$PR_NUMBER" --merge; then
                echo "Release PR #$PR_NUMBER merged into main."
                break
              fi
              echo "Merge attempt $i failed, retrying in ${i}s..."
              sleep "$i"
            done
          fi

      - name: Back-merge main into preprod (sync ahead/behind to 0)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"

          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            echo "Waiting for PR #$PR_NUMBER to merge before back-merge... ($i/30)"
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "::warning::PR not merged after 5 minutes. Skipping back-merge; next release will re-sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main's tip is a merge commit whose second parent is preprod's tip,
          # so preprod can fast-forward to main. Retry on race with another preprod write.
          for i in 1 2 3 4 5; do
            git fetch origin main preprod
            if git push origin origin/main:preprod; then
              echo "preprod fast-forwarded to main; ahead/behind is now 0/0."
              exit 0
            fi
            echo "Back-merge attempt $i lost a race with another preprod write, refetching..."
            sleep "$((i * 2))"
          done

          echo "::warning::Could not fast-forward preprod to main after 5 attempts."
          echo "::warning::preprod has diverged from main. Next release will re-sync, or run manually:"
          echo "::warning::  git checkout preprod && git merge --no-ff origin/main && git push origin preprod"
          exit 0

      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          PR_NUMBER="${{ steps.pr.outputs.number }}"

          # Wait for PR to actually be merged (handles --auto case)
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            echo "Waiting for PR #$PR_NUMBER to merge... (attempt $i/30)"
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "::warning::PR #$PR_NUMBER not yet merged after 5 minutes. Skipping tag. Create tag manually after merge."
            exit 0
          fi

          # --- Refuse to publish an incoherent tag -------------------------
          # Where a version bump workflow maintains a VERSION file, the tag
          # publishes that number rather than carrying one of its own, so
          # v + VERSION IS the tag. This is the only place that can compare a
          # tag against main before the tag exists, so it is where the
          # invariant is enforced rather than merely intended.
          #
          # Repos without a VERSION file skip the first check and keep the
          # second: a duplicate tag is wrong everywhere.
          #
          # Forge decision record 0018.
          git fetch origin main
          if git cat-file -e origin/main:VERSION 2>/dev/null; then
            MAIN_VERSION=$(git show origin/main:VERSION | tr -d '[:space:]')
            if [ "$VERSION" != "v${MAIN_VERSION}" ]; then
              echo "::error::Refusing to tag ${VERSION}: VERSION on main is ${MAIN_VERSION}, so the tag should be v${MAIN_VERSION}. The tag publishes the version; it does not carry one of its own."
              exit 1
            fi
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Refusing to tag ${VERSION}: that tag already exists and points at other content. Releasing it again would give one number two meanings."
            exit 1
          fi

          # Tag the merge commit on main
          git tag "$VERSION" origin/main
          git push origin "$VERSION"

          # Create GitHub Release
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/release-body.md \
            --target main

      - name: Clean up orphaned feature branch
        if: steps.release.outputs.cleanup_branch != ''
        run: |
          BRANCH="${{ steps.release.outputs.cleanup_branch }}"
          echo "Deleting orphaned release branch: $BRANCH"
          git push origin --delete "$BRANCH" || echo "Branch $BRANCH already deleted or not found."
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
